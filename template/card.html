<article class="coin-card">
    <div class="coin-image" aria-label="coin [N]"></div>
    <div class="coin-body">
        <h4 id="title[ID]" class="coin-title"></h4>
        <div class="coin-footer">
            <span id="issuerID"></span>
            <span id="grade[ID]"></span>
            <span id="value[ID]" class="price"></span>
        </div>
    </div>
</article>

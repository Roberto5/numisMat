<article class="coin-card">
    <div class="coin-image" aria-label="coin [id]">[image]</div>
    <div class="coin-body">
        <h4 id="title[id]" class="coin-title">[numeric_value] [currency] [name]</h4>
        <div>[year]</div>
        <div class="coin-footer">
            <span id="issuer[id]">[issuer]</span>
            <span id="grade[id]">[grade]</span>
            <span id="value[id]" class="price">[value] €</span>
        </div>
    </div>
</article>
